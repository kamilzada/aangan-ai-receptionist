<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aangan AI Receptionist · Components Map</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --linen:#F5F0E8; --paper:#FFFDF9; --oak:#B08A5E; --oak-ink:#8A6A44; --terra:#C46A4A; --char:#2B2925; --muted:#6B645A; --stone:#E2DACD; }
  html, body { margin:0; background:var(--linen); }
  body { width:1800px; height:1120px; font-family:Inter, system-ui, sans-serif; color:var(--char); }
  svg text { font-family:Inter, system-ui, sans-serif; }
  .serif { font-family:"Cormorant Garamond", Georgia, serif; }
</style>
</head>
<body>
<svg width="1800" height="1120" viewBox="0 0 1800 1120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A44"/>
    </marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C46A4A"/>
    </marker>
    <style>
      .box { fill:#FFFDF9; stroke:#E2DACD; stroke-width:1.5; }
      .actor { fill:#2B2925; }
      .app { fill:#FBF7F0; stroke:#B08A5E; stroke-width:1.5; stroke-dasharray:6 5; }
      .route { fill:#FFFDF9; stroke:#B08A5E; stroke-width:1.5; }
      .h { font-size:17px; font-weight:600; fill:#2B2925; }
      .hw { font-size:17px; font-weight:600; fill:#F5F0E8; }
      .s { font-size:13px; fill:#6B645A; }
      .sw { font-size:13px; fill:#D8CBB8; }
      .code { font-family: ui-monospace, Menlo, monospace; font-size:15px; font-weight:600; fill:#2B2925; }
      .tag { font-size:11px; font-weight:600; letter-spacing:.14em; fill:#8A6A44; }
      .ln { stroke:#8A6A44; stroke-width:1.6; fill:none; marker-end:url(#a); }
      .lt { stroke:#C46A4A; stroke-width:1.8; fill:none; marker-end:url(#t); }
      .lbl { font-size:12px; fill:#2B2925; }
      .lblbg { fill:#F5F0E8; }
    </style>
  </defs>

  <!-- Title -->
  <text x="48" y="58" class="tag">AANGAN STUDIO · MESA CASE 03</text>
  <text x="48" y="100" class="serif" font-size="44" font-weight="500" fill="#2B2925">AI phone receptionist: components map</text>
  <text x="48" y="128" class="s" font-size="14">Every missed call answered in seconds, qualified, booked with a designer, briefed on Telegram, logged in HubSpot and shown on a dashboard.</text>

  <!-- Legend -->
  <g transform="translate(1290,52)">
    <rect width="470" height="78" rx="12" class="box"/>
    <line x1="20" y1="28" x2="62" y2="28" class="ln"/><text x="72" y="32" class="s">data / request flow</text>
    <line x1="230" y1="28" x2="272" y2="28" class="lt"/><text x="282" y="32" class="s">urgent complaint path</text>
    <rect x="20" y="46" width="42" height="18" rx="5" class="route"/><text x="72" y="60" class="s">our code (Vercel)</text>
    <rect x="230" y="46" width="42" height="18" rx="5" class="actor"/><text x="282" y="60" class="s">people</text>
  </g>

  <!-- ============ Column 1: people / entry ============ -->
  <rect x="48" y="190" width="200" height="74" rx="12" class="actor"/>
  <text x="68" y="222" class="hw">Caller</text>
  <text x="68" y="244" class="sw">new lead, client, anyone</text>

  <rect x="48" y="900" width="200" height="74" rx="12" class="actor"/>
  <text x="68" y="932" class="hw">Rahul</text>
  <text x="68" y="954" class="sw">ops / founder's office</text>

  <!-- ============ Column 2: telephony + Vaani ============ -->
  <rect x="320" y="186" width="270" height="82" rx="12" class="box"/>
  <text x="340" y="218" class="h">Studio phone line</text>
  <text x="340" y="240" class="s">forwards on no-answer, busy,</text>
  <text x="340" y="257" class="s">and after hours (10am–7pm desk)</text>

  <rect x="320" y="320" width="270" height="310" rx="12" class="box"/>
  <text x="340" y="348" class="tag">VOICE AGENT</text>
  <text x="340" y="374" class="h">Vaani AI</text>
  <text x="340" y="398" class="s">Prompt: location → size → scope</text>
  <text x="340" y="415" class="s">→ timeline → book. Never quotes</text>
  <text x="340" y="432" class="s">prices; never asks decision-maker.</text>
  <text x="340" y="460" class="s">Knowledge base: services +</text>
  <text x="340" y="477" class="s">qualification rules (no pricing.md)</text>
  <text x="340" y="505" class="s">Custom tools (mid-call):</text>
  <text x="352" y="524" class="code" font-size="13">check_designer_slots</text>
  <text x="352" y="543" class="code" font-size="13">book_designer_meeting</text>
  <text x="340" y="571" class="s">Agent webhook (HMAC-signed):</text>
  <text x="352" y="590" class="code" font-size="13">call_started</text>
  <text x="352" y="608" class="code" font-size="13">call_postprocessing</text>

  <!-- ============ Column 3: our app on Vercel ============ -->
  <rect x="680" y="160" width="400" height="860" rx="16" class="app"/>
  <text x="704" y="190" class="tag">VERCEL · NEXT.JS (TYPESCRIPT)</text>
  <text x="704" y="210" class="s">aangan-ai-receptionist.vercel.app · deploys from GitHub</text>

  <rect x="704" y="236" width="352" height="82" rx="10" class="route"/>
  <text x="724" y="266" class="code">POST /api/vaani/slots</text>
  <text x="724" y="288" class="s">free 30-min slots, round-robin across</text>
  <text x="724" y="304" class="s">designers, spoken times for the agent</text>

  <rect x="704" y="340" width="352" height="100" rx="10" class="route"/>
  <text x="724" y="370" class="code">POST /api/vaani/book</text>
  <text x="724" y="392" class="s">re-check slot → event in designer's own</text>
  <text x="724" y="408" class="s">calendar → advance round-robin → brief</text>
  <text x="724" y="424" class="s">→ email + .ics only if caller said yes</text>

  <rect x="704" y="500" width="352" height="118" rx="10" class="route"/>
  <text x="724" y="530" class="code">POST /api/vaani/webhook</text>
  <text x="724" y="552" class="s">idempotent on Vaani call id → classify</text>
  <text x="724" y="568" class="s">transcript → HubSpot contact, call, deal</text>
  <text x="724" y="584" class="s">(if booked) → urgent alert if complaint</text>
  <text x="724" y="604" class="s">auth: x-vaani-secret or HMAC signature</text>

  <rect x="704" y="720" width="352" height="82" rx="10" class="route"/>
  <text x="724" y="750" class="code">POST /api/telegram/webhook</text>
  <text x="724" y="772" class="s">designer sends /start &lt;code&gt; once →</text>
  <text x="724" y="788" class="s">chat id saved against that designer</text>

  <rect x="704" y="890" width="352" height="100" rx="10" class="route"/>
  <text x="724" y="920" class="code">/dashboard</text>
  <text x="724" y="942" class="s">passcode cookie · reads HubSpot server-side:</text>
  <text x="724" y="958" class="s">calls handled, after-hours %, bookings,</text>
  <text x="724" y="974" class="s">booking rate, declines, complaints, trend</text>

  <!-- ============ Column 4: services ============ -->
  <rect x="1240" y="200" width="270" height="74" rx="12" class="box"/>
  <text x="1260" y="230" class="h">Google Calendar</text>
  <text x="1260" y="252" class="s">one calendar per designer (OAuth)</text>

  <rect x="1240" y="330" width="270" height="74" rx="12" class="box"/>
  <text x="1260" y="360" class="h">Supabase (Postgres)</text>
  <text x="1260" y="382" class="s">designers, chat ids, round-robin, logs</text>

  <rect x="1240" y="436" width="270" height="74" rx="12" class="box"/>
  <text x="1260" y="466" class="h">Resend</text>
  <text x="1260" y="488" class="s">confirmation email + .ics invite</text>

  <rect x="1240" y="540" width="270" height="74" rx="12" class="box"/>
  <text x="1260" y="570" class="h">Gemini Flash</text>
  <text x="1260" y="592" class="s">call type, outcome, decline reason</text>

  <rect x="1240" y="646" width="270" height="74" rx="12" class="box"/>
  <text x="1260" y="676" class="h">HubSpot CRM (free)</text>
  <text x="1260" y="698" class="s">system of record: contacts, calls, deals</text>

  <rect x="1240" y="760" width="270" height="74" rx="12" class="box"/>
  <text x="1260" y="790" class="h">Telegram Bot API</text>
  <text x="1260" y="812" class="s">@aangan_bookings_kz_bot</text>

  <!-- ============ Column 5: recipients ============ -->
  <rect x="1580" y="436" width="180" height="74" rx="12" class="actor"/>
  <text x="1598" y="466" class="hw">Client inbox</text>
  <text x="1598" y="488" class="sw">only if they said yes</text>

  <rect x="1580" y="730" width="180" height="62" rx="12" class="actor"/>
  <text x="1598" y="758" class="hw">Designers</text>
  <text x="1598" y="778" class="sw">meeting brief</text>

  <rect x="1580" y="808" width="180" height="62" rx="12" class="actor"/>
  <text x="1598" y="836" class="hw">Nikhil</text>
  <text x="1598" y="856" class="sw">urgent complaint</text>

  <!-- ============ Arrows ============ -->
  <!-- caller → line → vaani -->
  <line x1="248" y1="227" x2="316" y2="227" class="ln"/>
  <line x1="455" y1="268" x2="455" y2="316" class="ln"/>
  <rect x="463" y="281" width="98" height="20" rx="4" class="lblbg"/><text x="468" y="296" class="lbl">forwarded call</text>

  <!-- vaani → routes -->
  <path d="M590 380 C 640 380, 640 277, 700 277" class="ln"/>
  <rect x="604" y="300" width="58" height="20" rx="4" class="lblbg"/><text x="608" y="315" class="lbl">tool call</text>
  <path d="M590 450 C 640 450, 650 390, 700 390" class="ln"/>
  <rect x="604" y="420" width="58" height="20" rx="4" class="lblbg"/><text x="608" y="435" class="lbl">tool call</text>
  <path d="M590 580 C 640 580, 650 559, 700 559" class="ln"/>
  <rect x="598" y="604" width="78" height="20" rx="4" class="lblbg"/><text x="602" y="619" class="lbl">after the call</text>

  <!-- slots/book → calendar -->
  <path d="M1056 270 C 1150 270, 1150 237, 1236 237" class="ln"/>
  <rect x="1110" y="232" width="70" height="20" rx="4" class="lblbg"/><text x="1114" y="247" class="lbl">free / busy</text>
  <path d="M1056 360 C 1160 360, 1150 258, 1236 258" class="ln"/>
  <rect x="1150" y="300" width="80" height="20" rx="4" class="lblbg"/><text x="1154" y="315" class="lbl">create event</text>

  <!-- book → supabase, resend, telegram -->
  <path d="M1056 385 C 1150 385, 1150 367, 1236 367" class="ln"/>
  <path d="M1056 410 C 1150 410, 1150 473, 1236 473" class="ln"/>
  <path d="M1056 428 C 1120 440, 1120 770, 1236 780" class="ln"/>
  <rect x="1094" y="640" width="88" height="20" rx="4" class="lblbg"/><text x="1098" y="655" class="lbl">designer brief</text>

  <!-- webhook → supabase, gemini, hubspot, telegram (urgent) -->
  <path d="M1056 520 C 1170 520, 1150 395, 1236 395" class="ln"/>
  <rect x="1150" y="410" width="86" height="20" rx="4" class="lblbg"/><text x="1154" y="425" class="lbl">idempotency</text>
  <path d="M1056 560 C 1150 560, 1150 577, 1236 577" class="ln"/>
  <rect x="1110" y="548" width="58" height="20" rx="4" class="lblbg"/><text x="1114" y="563" class="lbl">classify</text>
  <path d="M1056 590 C 1150 590, 1150 683, 1236 683" class="ln"/>
  <rect x="1150" y="600" width="88" height="20" rx="4" class="lblbg"/><text x="1154" y="615" class="lbl">log call + deal</text>
  <path d="M1056 610 C 1110 640, 1130 800, 1236 812" class="lt"/>
  <rect x="1150" y="728" width="78" height="20" rx="4" class="lblbg"/><text x="1154" y="743" class="lbl" fill="#C46A4A">urgent alert</text>

  <!-- telegram webhook ↔ telegram -->
  <path d="M1236 800 C 1160 800, 1150 761, 1060 761" class="ln"/>
  <rect x="1108" y="776" width="94" height="20" rx="4" class="lblbg"/><text x="1112" y="791" class="lbl">/start &lt;code&gt;</text>

  <!-- services → recipients -->
  <line x1="1510" y1="473" x2="1576" y2="473" class="ln"/>
  <line x1="1510" y1="785" x2="1576" y2="762" class="ln"/>
  <line x1="1510" y1="810" x2="1576" y2="838" class="lt"/>

  <!-- dashboard -->
  <line x1="248" y1="937" x2="700" y2="937" class="ln"/>
  <rect x="420" y="944" width="110" height="20" rx="4" class="lblbg"/><text x="424" y="959" class="lbl">opens on phone / web</text>
  <path d="M1056 930 C 1180 930, 1180 720, 1300 724" class="ln"/>
  <rect x="1150" y="880" width="104" height="20" rx="4" class="lblbg"/><text x="1154" y="895" class="lbl">reads (server-side)</text>

  <!-- footer -->
  <text x="48" y="1080" class="s">Stack: Vaani AI · Next.js 16 on Vercel · Google Calendar · Supabase · Telegram · Resend · Gemini Flash · HubSpot free CRM · GitHub. Secrets only in Vercel env; every tool call authenticated.</text>
</svg>
</body>
</html>
