<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aangan AI Receptionist · Components</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background:#F5F0E8; }
  body { width:1440px; height:880px; }
  text { font-family: Inter, system-ui, sans-serif; }
</style>
</head>
<body>
<svg width="1440" height="880" viewBox="0 0 1440 880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A6A44"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C46A4A"/>
    </marker>
    <style>
      .lane { fill:#FFFDF9; stroke:#E2DACD; stroke-width:1.2; }
      .laneTag { font-size:11px; font-weight:600; letter-spacing:.16em; fill:#8A6A44; }
      .title { font-family:"Cormorant Garamond", Georgia, serif; font-size:46px; font-weight:500; fill:#2B2925; }
      .laneName { font-size:20px; font-weight:500; fill:#2B2925; font-family:"Cormorant Garamond", Georgia, serif; }
      .box { fill:#FFFFFF; stroke:#D9CDBA; stroke-width:1.4; }
      .ours { fill:#FFFFFF; stroke:#B08A5E; stroke-width:2; }
      .person { fill:#2B2925; }
      .t { font-size:16px; font-weight:600; fill:#2B2925; }
      .tw { font-size:16px; font-weight:600; fill:#F5F0E8; }
      .d { font-size:13px; fill:#6B645A; }
      .dw { font-size:13px; fill:#CDBFAA; }
      .ln { stroke:#8A6A44; stroke-width:1.6; fill:none; marker-end:url(#a); }
      .lr { stroke:#C46A4A; stroke-width:1.8; fill:none; marker-end:url(#r); }
      .dash { stroke:#B08A5E; stroke-width:1.3; fill:none; stroke-dasharray:4 4; }
    </style>
  </defs>

  <!-- Header -->
  <text x="56" y="62" class="laneTag">AANGAN STUDIO · MESA CASE 03</text>
  <text x="56" y="106" class="title">AI phone receptionist</text>
  <g transform="translate(1040,70)">
    <rect width="14" height="14" rx="3" class="ours"/><text x="22" y="12" class="d">our app on Vercel</text>
    <rect x="160" width="14" height="14" rx="3" class="person"/><text x="182" y="12" class="d">people</text>
    <line x1="250" y1="7" x2="282" y2="7" class="lr"/><text x="290" y="12" class="d">urgent</text>
  </g>

  <!-- Lanes -->
  <rect x="40" y="140" width="1360" height="250" rx="16" class="lane"/>
  <text x="64" y="172" class="laneTag">1 · DURING THE CALL</text>

  <rect x="40" y="410" width="1360" height="250" rx="16" class="lane"/>
  <text x="64" y="442" class="laneTag">2 · AFTER THE CALL</text>

  <rect x="40" y="680" width="1360" height="150" rx="16" class="lane"/>
  <text x="64" y="712" class="laneTag">3 · REPORTING</text>

  <!-- Lane 1 -->
  <rect x="80" y="230" width="190" height="76" rx="12" class="person"/>
  <text x="100" y="262" class="tw">Caller</text>
  <text x="100" y="284" class="dw">missed or after-hours call</text>

  <rect x="340" y="200" width="220" height="400" rx="14" class="box"/>
  <text x="362" y="236" class="t">Vaani AI voice agent</text>
  <text x="362" y="262" class="d">qualifies: area → size →</text>
  <text x="362" y="280" class="d">scope → timeline</text>
  <text x="362" y="310" class="d">no prices, no</text>
  <text x="362" y="328" class="d">decision-maker question</text>
  <text x="362" y="358" class="d">knowledge: services +</text>
  <text x="362" y="376" class="d">qualification rules</text>
  <line x1="362" y1="420" x2="538" y2="420" stroke="#E2DACD"/>
  <text x="362" y="456" class="d">mid-call: 2 custom tools</text>
  <text x="362" y="474" class="d">end of call: signed webhook</text>
  <text x="362" y="534" class="d">sends the transcript →</text>

  <rect x="660" y="220" width="250" height="96" rx="12" class="ours"/>
  <text x="682" y="254" class="t">Booking API</text>
  <text x="682" y="278" class="d">find free slots · book meeting</text>
  <text x="682" y="296" class="d">round-robin across designers</text>

  <rect x="1020" y="176" width="356" height="56" rx="12" class="box"/>
  <text x="1042" y="210" class="t">Google Calendar</text><text x="1190" y="210" class="d">designer's own calendar</text>

  <rect x="1020" y="242" width="356" height="56" rx="12" class="box"/>
  <text x="1042" y="276" class="t">Telegram</text><text x="1190" y="276" class="d">brief to the designer</text>

  <rect x="1020" y="308" width="356" height="56" rx="12" class="box"/>
  <text x="1042" y="342" class="t">Resend email</text><text x="1190" y="342" class="d">client invite, if they ask</text>

  <line x1="270" y1="268" x2="336" y2="268" class="ln"/>
  <line x1="560" y1="268" x2="656" y2="268" class="ln"/>
  <path d="M910 252 C 960 252, 970 204, 1016 204" class="ln"/>
  <line x1="910" y1="270" x2="1016" y2="270" class="ln"/>
  <path d="M910 288 C 960 288, 970 336, 1016 336" class="ln"/>

  <!-- Lane 2 -->
  <rect x="660" y="486" width="250" height="96" rx="12" class="ours"/>
  <text x="682" y="520" class="t">Call webhook</text>
  <text x="682" y="544" class="d">transcript in, once per call</text>
  <text x="682" y="562" class="d">(duplicates ignored)</text>

  <rect x="1020" y="446" width="356" height="56" rx="12" class="box"/>
  <text x="1042" y="480" class="t">Gemini Flash</text><text x="1190" y="480" class="d">classify the call</text>

  <rect x="1020" y="512" width="356" height="56" rx="12" class="box"/>
  <text x="1042" y="546" class="t">HubSpot CRM</text><text x="1190" y="546" class="d">contact · call · deal</text>

  <rect x="1020" y="578" width="356" height="56" rx="12" class="box"/>
  <text x="1042" y="612" class="t">Telegram</text><text x="1190" y="612" class="d">complaint alert to Nikhil</text>

  <path d="M560 534 L 656 534" class="ln"/>
  <path d="M910 518 C 960 518, 970 474, 1016 474" class="ln"/>
  <line x1="910" y1="536" x2="1016" y2="540" class="ln"/>
  <path d="M910 556 C 960 556, 970 606, 1016 606" class="lr"/>

  <!-- shared state -->
  <rect x="660" y="352" width="250" height="40" rx="20" fill="#F5F0E8" stroke="#D9CDBA"/>
  <text x="785" y="377" text-anchor="middle" class="d">Supabase · state &amp; dedupe</text>
  <line x1="785" y1="316" x2="785" y2="352" class="dash"/>
  <line x1="785" y1="392" x2="785" y2="486" class="dash"/>

  <!-- Lane 3 -->
  <rect x="80" y="726" width="190" height="76" rx="12" class="person"/>
  <text x="100" y="758" class="tw">Rahul</text>
  <text x="100" y="780" class="dw">studio operations</text>

  <rect x="660" y="716" width="250" height="96" rx="12" class="ours"/>
  <text x="682" y="750" class="t">Dashboard</text>
  <text x="682" y="774" class="d">calls, bookings, after-hours,</text>
  <text x="682" y="792" class="d">declines, complaints · passcode</text>

  <rect x="1020" y="736" width="356" height="56" rx="12" class="box"/>
  <text x="1042" y="770" class="t">HubSpot CRM</text><text x="1190" y="770" class="d">read server-side</text>

  <line x1="270" y1="764" x2="656" y2="764" class="ln"/>
  <line x1="910" y1="764" x2="1016" y2="764" class="ln"/>

  <text x="56" y="862" class="d">Next.js on Vercel · deployed from GitHub · aangan-ai-receptionist.vercel.app</text>
</svg>
</body>
</html>
